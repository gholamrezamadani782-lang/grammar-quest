<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grammar Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Grammar Quest">
<meta name="theme-color" content="#EDF0FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12142A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:"Lilita One";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-700.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/atkinson-400-italic.woff2) format("woff2")}
html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
/* Layout: one thumb-width column; a stepping-stone world map, one card per screen while playing. */
:root{
  --bg:#EDF0FF; --card:#FFFFFF; --ink:#1A1D3A; --muted:#5A5F87; --line:#D7DCF6; --edge:#C3C9EE;
  --sun:#FFC83D; --sun-edge:#D99E00; --sun-ink:#3A2900;
  --ok:#14995B; --ok-soft:#DCF5E8; --bad:#D93A40; --bad-soft:#FDE3E4;
  --gold:#F5B300; --lock:#B4B9D8;
  --c-pres:#2F6FEB; --c-prog:#EF7410; --c-past:#0F9C78; --c-pastprog:#8547EE; --c-state:#0B93A6; --c-plan:#D63A8A; --c-perf:#667A00; --c-perfprog:#A1582B; --c-pastperf:#56627F; --c-pastperfprog:#8E3B46; --c-fut:#A21CAF; --c-futperf:#0369A1;
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12142A; --card:#1D2044; --ink:#F1F2FF; --muted:#A9AED6; --line:#2F3368; --edge:#272A58;
  --sun:#FFC83D; --sun-edge:#C48C00; --sun-ink:#2E2100;
  --ok:#3DD68C; --ok-soft:#163A2A; --bad:#FF6B70; --bad-soft:#42202A;
  --gold:#FFC83D; --lock:#4A4F80;
  --c-pres:#77A4FF; --c-prog:#FF9C45; --c-past:#3BD3A8; --c-pastprog:#B18CFF; --c-state:#39C9DC; --c-plan:#FF6EB5; --c-perf:#C6DB3A; --c-perfprog:#E8A070; --c-pastperf:#B4BEDA; --c-pastperfprog:#E79AA5; --c-fut:#E879F9; --c-futperf:#7DD3FC;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12142A; --card:#1D2044; --ink:#F1F2FF; --muted:#A9AED6; --line:#2F3368; --edge:#272A58;
  --sun:#FFC83D; --sun-edge:#C48C00; --sun-ink:#2E2100;
  --ok:#3DD68C; --ok-soft:#163A2A; --bad:#FF6B70; --bad-soft:#42202A;
  --gold:#FFC83D; --lock:#4A4F80;
  --c-pres:#77A4FF; --c-prog:#FF9C45; --c-past:#3BD3A8; --c-pastprog:#B18CFF; --c-state:#39C9DC; --c-plan:#FF6EB5; --c-perf:#C6DB3A; --c-perfprog:#E8A070; --c-pastperf:#B4BEDA; --c-pastperfprog:#E79AA5; --c-fut:#E879F9; --c-futperf:#7DD3FC;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--c-pres);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.3px;text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.t-pres{--tc:var(--c-pres)} .t-prog{--tc:var(--c-prog)} .t-past{--tc:var(--c-past)} .t-pastprog{--tc:var(--c-pastprog)} .t-state{--tc:var(--c-state)} .t-plan{--tc:var(--c-plan)} .t-perf{--tc:var(--c-perf)} .t-perfprog{--tc:var(--c-perfprog)} .t-pastperf{--tc:var(--c-pastperf)} .t-pastperfprog{--tc:var(--c-pastperfprog)} .t-fut{--tc:var(--c-fut)} .t-futperf{--tc:var(--c-futperf)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:18px;background:var(--sun);color:var(--sun-ink);font-family:var(--f-display);font-size:21px;letter-spacing:.4px;box-shadow:0 5px 0 var(--sun-edge);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-edge)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--edge);cursor:default}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--edge);border:2px solid var(--line)}
.btn.small{min-height:46px;font-size:18px;border-radius:14px}
.iconbtn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;box-shadow:0 3px 0 var(--edge)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.linkbtn{background:none;border:0;padding:8px 4px;color:var(--c-pres);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Header stats */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--ink)}
.brand span{color:var(--c-prog)}
.stats{display:flex;gap:8px;align-items:stretch;margin:10px 0 18px}
.stat{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--edge)}
.stat .lab{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
.stat .val{font-family:var(--f-display);font-size:24px;line-height:1.1}
.xpbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-prog),var(--sun));border-radius:99px;transition:width .5s}
.flame.off{filter:grayscale(1);opacity:.5}

/* World map */
.world{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:18px 16px 22px;box-shadow:0 5px 0 var(--edge)}
.world-head{display:flex;gap:12px;align-items:center}
.world-icon{font-size:38px;line-height:1}
.world-num{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.world h2{font-size:26px;line-height:1.05}
.path{position:relative;display:flex;flex-direction:column;gap:10px;margin-top:18px}
.stone{position:relative;display:flex;align-items:center;gap:14px;width:86%;padding:6px;border:0;background:none;text-align:left;border-radius:20px}
.stone:nth-child(even){margin-left:14%}
.stone .disc{flex:none;display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--tc,var(--c-pres));color:#fff;font-family:var(--f-display);font-size:19px;box-shadow:0 6px 0 rgba(0,0,0,.22), inset 0 -5px 0 rgba(0,0,0,.12);position:relative}
.stone .disc small{font-size:13px}
.stone .meta{min-width:0}
.stone .meta b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1}
.stone .meta span{font-size:14px;color:var(--muted)}
.stone.locked .disc{background:var(--lock);box-shadow:0 6px 0 var(--edge)}
.stone.locked{cursor:default}
.stone.locked .meta b{color:var(--muted)}
.stone .star{position:absolute;right:-6px;top:-6px;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3A2900;display:grid;place-items:center;font-size:15px;border:3px solid var(--card)}
.ring{position:absolute;inset:-6px;border-radius:50%;border:4px solid var(--tc,var(--c-pres));opacity:.35}
.stone:not(.locked):active .disc{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{font-size:13px;font-weight:700;background:var(--bg);border:2px solid var(--line);border-radius:99px;padding:3px 10px}

/* Level screen */
.backrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.backrow h1{font-size:26px;line-height:1.05}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tc,var(--muted))}
.rule{background:var(--card);border:2px solid var(--line);border-top:8px solid var(--tc);border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--edge);display:flex;flex-direction:column;gap:12px}
.rule-lines p{margin:0;font-size:19px;font-weight:700}
.rule-lines p+p{margin-top:4px}
.tlgrid{display:grid;gap:10px}
.tlfig{margin:0;background:var(--bg);border-radius:16px;padding:8px 10px 4px}
.tlfig figcaption{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.tlfig svg{display:block;width:100%;max-width:420px;height:auto;margin:0 auto}
.tl-lab{fill:var(--muted);font:600 12px var(--f-body)}
.tl-note{font:700 12px var(--f-body)}
.ax{stroke:var(--muted);stroke-width:2}
.axh{fill:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:var(--tc)}
.ex{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.ex .spk{flex:none}
mark{background:none;color:var(--tc);font-weight:700;border-bottom:3px solid var(--tc);padding:0 1px}
.chipgroup .lab{font-size:13px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px;font-weight:700;font-size:16px}
.sect{font-family:var(--f-display);font-size:21px;margin:24px 0 10px}
.mlist{display:grid;gap:10px}
.mcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 14px;box-shadow:0 4px 0 var(--edge)}
.mcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mcard .mi{font-size:30px;flex:none;width:40px;text-align:center}
.mcard .mt{flex:1;min-width:0}
.mcard .mt b{display:block;font-size:18px;line-height:1.2}
.mcard .mt span{font-size:14px;color:var(--muted)}
.mcard .ms{flex:none;font-size:15px;font-weight:700;color:var(--ok)}
.talk{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--edge);display:grid;gap:10px}
.talk p{margin:0}
.talk b{font-size:18px}

/* Play */
.play{display:flex;flex-direction:column;min-height:100%}
.playbar{display:flex;align-items:center;gap:12px;padding-top:6px}
.prog{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .35s}
.combo{font-family:var(--f-display);font-size:18px;color:var(--c-prog);min-width:44px;text-align:right}
.stage{flex:1;padding:22px 0 290px}
.qlabel{font-size:14px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.ctx{color:var(--muted);font-style:italic;margin:0 0 10px;font-size:17px}
.qtext{font-size:23px;line-height:1.4;font-weight:700;margin:0}
.qrow{display:flex;gap:10px;align-items:flex-start}
.qrow .qtext{flex:1;min-width:0}
.blank{display:inline-block;min-width:74px;border-bottom:4px solid var(--c-prog);color:transparent;line-height:1.1}
.blank.filled{color:var(--ok);border-color:var(--ok);min-width:0}
.verbhint{display:inline-block;margin-top:12px;font-weight:700;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:4px 12px;color:var(--c-prog)}
.opts{display:grid;gap:12px;margin-top:22px}
.opt{width:100%;text-align:left;min-height:58px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:19px;font-weight:700;box-shadow:0 4px 0 var(--edge);transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt.sel{border-color:var(--c-pres);box-shadow:0 4px 0 var(--c-pres);background:color-mix(in srgb,var(--c-pres) 10%,var(--card))}
.opt.right{border-color:var(--ok);box-shadow:0 4px 0 var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);box-shadow:0 4px 0 var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opts.two{grid-template-columns:1fr 1fr}
.opts.two .opt{text-align:center}
.bigword{font-family:var(--f-display);font-size:44px;text-align:center;margin:26px 0 8px;color:var(--c-state)}
.fillin{width:100%;margin-top:22px;font:700 22px var(--f-body);padding:14px 16px;border-radius:18px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.fillin:focus{border-color:var(--c-pres);outline:none}
.fillin.right{border-color:var(--ok);background:var(--ok-soft)}
.fillin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.listenbox{display:flex;gap:12px;justify-content:center;margin:12px 0 4px}
.playbig{width:96px;height:96px;border-radius:50%;border:0;background:var(--c-pres);color:#fff;font-size:40px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.playbig:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.playslow{align-self:center;width:62px;height:62px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:26px;box-shadow:0 4px 0 var(--edge)}
.hidden-text{color:var(--muted);text-align:center;font-weight:700;margin:6px 0 0}
.tokens{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tok{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-size:20px;font-weight:700;box-shadow:0 3px 0 var(--edge)}
.tok.sel{border-color:var(--c-prog);background:color-mix(in srgb,var(--c-prog) 14%,var(--card));box-shadow:0 3px 0 var(--c-prog)}
.tok.err{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.tok.miss{border-color:var(--bad);border-style:dashed}
.step2{margin-top:20px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-top:12px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock>div{max-width:560px;margin:0 auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:3px solid;animation:up .22s ease-out}
.sheet>div{max-width:560px;margin:0 auto;display:grid;gap:10px}
.sheet.ok{background:var(--ok-soft);border-color:var(--ok)}
.sheet.bad{background:var(--bad-soft);border-color:var(--bad)}
.sheet .head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:26px}
.sheet.ok .head{color:var(--ok)} .sheet.bad .head{color:var(--bad)}
.sheet .head .xp{font-size:19px;color:var(--c-prog)}
.sheet .ans{font-size:18px}
.sheet .ans b{font-weight:700}
.why{display:flex;gap:8px;align-items:flex-start;font-size:17px}
.rtag{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;border:2px solid var(--tc);color:var(--tc);border-radius:99px;padding:1px 8px;background:var(--card)}
.sheet .row{display:flex;gap:10px;align-items:center}
.sheet .row .btn{flex:1}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.pop{animation:pop .35s ease-out}

/* Result */
.result{text-align:center;padding-top:30px;display:grid;gap:14px}
.result .trophy{font-size:84px;line-height:1}
.result h1{font-size:36px}
.rstats{display:flex;gap:10px;justify-content:center}
.rstats .stat{flex:0 1 150px;text-align:center}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px)}
.chat{display:flex;flex-direction:column;height:100%}
.chat .wrap{width:100%}
.chathead{display:flex;align-items:center;gap:10px;padding-block:12px}
.chathead h2{flex:1;font-size:22px}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;white-space:pre-wrap;font-size:17px;line-height:1.4;position:relative}
.msg.ai{align-self:flex-start;background:var(--card);border:2px solid var(--line);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--c-pres);color:#fff;border-bottom-right-radius:6px}
.msg .say{margin-top:6px;font-size:14px}
.composer{display:flex;gap:8px;padding-top:10px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
.composer textarea{flex:1;min-width:0;resize:none;font:18px var(--f-body);padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:50px;max-height:120px}
.composer .btn{width:auto;padding:0 18px}
.task{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font-size:16px}
.promptbox{width:100%;min-height:180px;font:15px var(--f-body);padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.toasts{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;z-index:60;display:grid;justify-items:center;gap:8px;pointer-events:none;padding-inline:16px}
.toast{background:var(--ink);color:var(--bg);font-weight:700;padding:10px 16px;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:pop .35s ease-out;max-width:520px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:3px;animation:fall .95s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.err{background:var(--card);border:2px solid var(--bad);border-radius:18px;padding:16px}

/* Lessons */
.ltitle{font-size:28px;line-height:1.1;margin-bottom:14px}
.lcard{display:grid;gap:14px}
.llines p{margin:0;font-size:20px;font-weight:700;line-height:1.35}
.llines p+p{margin-top:6px;font-weight:400}
.cmp{display:grid;gap:10px}
.cmp .side{border:2px solid var(--tc);border-left-width:8px;border-radius:18px;padding:12px;background:var(--card);display:grid;gap:8px}
.cmp .side h3{font-size:19px;color:var(--tc)}
.cmp .vs{justify-self:center;font-family:var(--f-display);font-size:18px;color:var(--muted)}
.tip{background:color-mix(in srgb,var(--sun) 22%,var(--card));border:2px solid var(--sun);border-radius:16px;padding:10px 12px;font-size:17px}
.lessonbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-radius:22px;padding:14px 16px;background:var(--sun);color:var(--sun-ink);box-shadow:0 5px 0 var(--sun-edge);margin-top:4px}

</head><body>
<div id="app"><div class="wrap"><p class="muted">Loading Grammar Quest…</p></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
(() => {
"use strict";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TNAME = {pres:"Simple present",prog:"Present progressive",past:"Simple past",pastprog:"Past progressive",state:"Stative",plan:"Plans",perf:"Present perfect",perfprog:"Present perfect progressive",pastperf:"Past perfect",pastperfprog:"Past perfect progressive",fut:"Future",futperf:"Future perfect"};
const APP_VERSION = "3.0";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- state ---------- */
const LS_KEY = "grammar-quest-v1";
const fresh = () => ({xp:0, streak:0, lastDay:"", cleared:{}, best:{}, badges:[], talks:{}});
let S = fresh();
try { const r = localStorage.getItem(LS_KEY); if (r) S = Object.assign(fresh(), JSON.parse(r)); } catch {}
let dbRef = null, writing = Promise.resolve();

function merge(a, b){
  const m = fresh();
  m.xp = Math.max(a.xp||0, b.xp||0);
  const later = (a.lastDay||"") >= (b.lastDay||"") ? a : b;
  m.streak = later.streak||0; m.lastDay = later.lastDay||"";
  m.cleared = Object.assign({}, b.cleared, a.cleared);
  m.talks = Object.assign({}, b.talks, a.talks);
  for (const src of [a.best||{}, b.best||{}]) for (const k in src) m.best[k] = Math.max(m.best[k]||0, src[k]);
  m.badges = [...new Set([...(a.badges||[]), ...(b.badges||[])])];
  return m;
}
function save(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {}
  if (!dbRef) return;
  const body = JSON.parse(JSON.stringify(S));
  writing = writing.then(() => dbRef.set(body)).catch(() => {});
}
async function connectDb(){
  if (!window.claude?.use) return;
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const ref = db.doc("data/users/" + id + "/progress");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote) { S = merge(S, remote); try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch {} if (view.name === "home" || view.name === "level") render(); }
    dbRef = ref;
    if (!remote || JSON.stringify(merge(remote, {})) !== JSON.stringify(S)) save();
  } catch {}
}

const dayStr = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today = () => dayStr(new Date());
const yesterday = () => { const d = new Date(); d.setDate(d.getDate()-1); return dayStr(d); };
const liveStreak = () => (S.lastDay === today() || S.lastDay === yesterday()) ? S.streak : 0;
const lvlOf = xp => Math.floor(xp/100) + 1;
function addXP(n){
  const before = lvlOf(S.xp); S.xp += n;
  if (lvlOf(S.xp) > before) toast("⭐ Level up! You're now level " + lvlOf(S.xp));
}
function touchStreak(){
  const t = today(); if (S.lastDay === t) return;
  S.streak = S.lastDay === yesterday() ? (S.streak||0) + 1 : 1; S.lastDay = t;
  if (S.streak > 1) toast("🔥 " + S.streak + "-day streak!"); else toast("🔥 Streak started!");
}
function toast(msg){
  const el = document.createElement("div"); el.className = "toast"; el.textContent = msg;
  document.getElementById("toasts").appendChild(el); setTimeout(() => el.remove(), 2600);
}
function confetti(){
  if (reduced) return;
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["--c-pres","--c-prog","--c-past","--c-pastprog","--c-plan","--sun"];
  for (let i = 0; i < 30; i++){ const p = document.createElement("i");
    p.style.left = Math.random()*100 + "%"; p.style.background = "var(" + cols[i % cols.length] + ")";
    p.style.animationDelay = (Math.random()*0.2) + "s"; box.appendChild(p); }
  document.body.appendChild(box); setTimeout(() => box.remove(), 1300);
}

/* ---------- speech ---------- */
const canSpeak = "speechSynthesis" in window;
let voice = null;
const VOICE_KEY = "grammar-quest-voice";
const enVoices = () => canSpeak ? speechSynthesis.getVoices().filter(x => /^en([-_]|$)/i.test(x.lang)) : [];
function pickVoice(){
  let want = null; try { want = localStorage.getItem(VOICE_KEY); } catch {}
  const score = x => (x.name === want ? 100 : 0) + (/^en[-_]US/i.test(x.lang) ? 10 : 0) + (/premium|enhanced/i.test(x.name) ? 5 : 0) + (/samantha|ava|allison|zoe|evan|nicky/i.test(x.name) ? 3 : 0) + (x.localService ? 1 : 0);
  voice = enVoices().sort((a, b) => score(b) - score(a))[0] || null;
}
if (canSpeak){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow){
  if (!canSpeak || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/_{3}/g, " blank ").replace(/[…]/g, ", "));
  if (voice) u.voice = voice; u.lang = voice?.lang || "en-US"; u.rate = slow ? 0.7 : 0.95;
  speechSynthesis.speak(u);
}
const spk = (text, label) => canSpeak ? `<button class="iconbtn spk" data-say="${esc(text)}" aria-label="${label||"Listen"}">🔊</button>` : "";

/* ---------- data ---------- */
let WORLDS = [], INDEX = [];
async function loadWorlds(){
  const idx = INDEX = await (await fetch("chapters/index.json")).json();
  const out = [];
  for (const e of idx){ if (!e.file) continue; try { out.push(await (await fetch(e.file)).json()); } catch (err) { console.error("chapter failed", e.file, err); } }
  WORLDS = out;
}
const mk = (ch, lv, i) => ch.id + "/" + lv + "/" + i;
const scoutKey = ch => ch.id + "/scout";
const bossKey = ch => ch.id + "/boss";
const levelCleared = (ch, lv) => lv.missions.filter((m,i) => S.cleared[mk(ch, lv.id, i)]).length;
const levelDone = (ch, lv) => levelCleared(ch, lv) === lv.missions.length;
const levelOpen = (ch, i) => i === 0 || levelCleared(ch, ch.levels[i-1]) > 0 || levelDone(ch, ch.levels[i]) || levelCleared(ch, ch.levels[i]) > 0;
const bossOpen = ch => ch.levels.every(lv => levelDone(ch, lv));
function findLevel(id){ for (const ch of WORLDS) for (const lv of ch.levels) if (lv.id === id) return {ch, lv}; return null; }

/* ---------- timeline drawings ---------- */
const AX = `<line x1="16" y1="62" x2="304" y2="62" class="ax"/><path d="M306 62 l-9 -5 v10z" class="axh"/><path d="M14 62 l9 -5 v10z" class="axh"/><line x1="170" y1="46" x2="170" y2="78" class="ax"/><text x="170" y="38" class="tl-lab" text-anchor="middle">now</text><text x="18" y="96" class="tl-lab">past</text><text x="302" y="96" class="tl-lab" text-anchor="end">future</text>`;
const X = (x, y, c) => `<path d="M${x-7} ${y-7} L${x+7} ${y+7} M${x+7} ${y-7} L${x-7} ${y+7}" stroke="var(--c-${c})" stroke-width="4" stroke-linecap="round"/>`;
function wave(x1, x2, y, c){ let d = `M${x1} ${y}`; for (let x = x1; x < x2; x += 12) d += " q3 -9 6 0 t6 0"; return `<path d="${d}" fill="none" stroke="var(--c-${c})" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`; }
const box = (x, y, w, label, c) => `<rect x="${x}" y="${y}" width="${w}" height="30" rx="10" fill="var(--c-${c})" fill-opacity=".16" stroke="var(--c-${c})" stroke-width="2"/><text x="${x+w/2}" y="${y+20}" text-anchor="middle" class="tl-note" fill="var(--c-${c})">${label}</text>`;
const two = (a, b, w = 104) => [a, b].map((r, i) => box(8, 12 + i * 50, w, r[0], r[1]) + `<text x="${w + 18}" y="${32 + i * 50}" class="tl-lab">${r[2]}</text><text x="312" y="${32 + i * 50}" class="tl-note" fill="var(--c-${r[1]})" text-anchor="end">${r[3]}</text>`).join("");
const rows3 = (rs, w = 150) => rs.map((r, i) => box(8, 8 + i * 50, w, r[0], r[1]) + `<text x="312" y="${28 + i * 50}" class="tl-note" fill="var(--c-${r[1]})" text-anchor="end">${r[2]}</text>`).join("");
const TL = {
  "simple-present": {c:"pres", t:"Simple present · always, every day", b: () => AX + [36,62,88,114,140,196,222,248,274].map(x => X(x,62,"pres")).join("")},
  "present-progressive": {c:"prog", t:"Present progressive · in progress now", b: () => AX + wave(122,206,62,"prog") + `<path d="M210 62 H254" stroke="var(--c-prog)" stroke-width="3" stroke-dasharray="4 6" fill="none"/><text x="122" y="86" class="tl-note" fill="var(--c-prog)" text-anchor="middle">start</text><text x="254" y="86" class="tl-note" fill="var(--c-prog)" text-anchor="middle">finish?</text>`},

  "was-going-to": {c:"plan", t:"was going to · a plan that didn't happen", b: () => AX + `<circle cx="56" cy="62" r="6" fill="var(--c-plan)"/><path d="M58 56 Q100 14 136 52" fill="none" stroke="var(--c-plan)" stroke-width="3" stroke-dasharray="5 6"/><circle cx="142" cy="62" r="10" fill="none" stroke="var(--c-plan)" stroke-width="3"/><path d="M134 54 L150 70" stroke="var(--c-plan)" stroke-width="3"/><text x="56" y="86" class="tl-note" fill="var(--c-plan)" text-anchor="middle">plan</text><text x="142" y="86" class="tl-note" fill="var(--c-plan)" text-anchor="middle">didn't happen</text>`},
  "forms": {c:"pres", t:"Two machines", b: () => box(8,12,104,"do / does","pres") + `<text x="122" y="32" class="tl-lab">+ verb</text><text x="312" y="32" class="tl-note" fill="var(--c-pres)" text-anchor="end">Does she help?</text>` + box(8,62,104,"am / is / are","prog") + `<text x="122" y="82" class="tl-lab">+ verb-ing</text><text x="312" y="82" class="tl-note" fill="var(--c-prog)" text-anchor="end">Is she helping?</text>`},
  "decide-present": {c:"state", t:"Which present tense?", vb:"0 0 320 156", b: () => {
    const q = (y, label) => `<rect x="6" y="${y}" width="150" height="34" rx="12" fill="var(--card)" stroke="var(--muted)" stroke-width="2"/><text x="81" y="${y+22}" text-anchor="middle" class="tl-note" fill="var(--ink)">${label}</text>`;
    const arrow = (x1, y1, x2, y2) => `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="var(--muted)" stroke-width="2.5"/><path d="M${x2} ${y2} l-8 -4 v8z" class="axh" transform="rotate(${x2 === x1 ? 90 : 0} ${x2} ${y2})"/>`;
    return q(6, "1. State verb?") + arrow(156, 23, 176, 23) + `<text x="166" y="14" class="tl-lab" text-anchor="middle">yes</text>` + box(178, 8, 136, "no -ing: I know", "state")

function tlFig(key){

  return `<figure class="tlfig t-${d.c}"><figcaption><i class="dot"></i>${esc(d.t)}</figcaption><svg viewBox="${d.vb || "0 0 320 104"}" role="img" aria-label="${esc(d.t)}">${d.b()}</svg></figure>`;
}
function hl(ex){
  let h = esc(ex.text);
  for (const [w, t] of (ex.hl||[])){ const e = esc(w); const i = h.indexOf(e); if (i >= 0) h = h.slice(0,i) + `<mark class="t-${t}">${e}</mark>` + h.slice(i+e.length); }
  return h;
}

  return `<section class="rule t-${lv.t}">
    <div class="rule-lines">${r.lines.map(l => `<p>${esc(l)}</p>`).join("")}</div>
    <div class="tlgrid">${(r.timeline||[]).map(tlFig).join("")}</div>
    <div class="tlgrid">${r.examples.map(ex => `<button class="ex" data-say="${esc(ex.text)}">${canSpeak ? '<span class="spk">🔊</span>' : ""}<span>${hl(ex)}</span></button>`).join("")}</div>
    ${chipsHTML(r.chips)}
  </section>`;
}
function chipsHTML(chips){
  if (!chips?.length) return "";
  const groups = typeof chips[0] === "string" ? [{label:"", words:chips}] : chips;
  return groups.map(g => `<div class="chipgroup">${g.label ? `<div class="lab">${esc(g.label)}</div>` : ""}<div class="chips">${g.words.map(w => `<button class="chip" data-say="${esc(w.replace("→", ","))}">${esc(w)}</button>`).join("")}</div></div>`).join("");
}
const exHTML = exs => (exs||[]).map(ex => typeof ex === "string" ? `<button class="ex" data-say="${esc(ex)}">${canSpeak ? '<span class="spk">🔊</span>' : ""}<span>${esc(ex)}</span></button>` : `<button class="ex" data-say="${esc(ex.text)}">${canSpeak ? '<span class="spk">🔊</span>' : ""}<span>${hl(ex)}</span></button>`).join("");
function learnHTML(it){
  if (it.type === "compare"){
    const side = s => `<div class="side t-${s.t}"><h3>${esc(s.label)}</h3>${exHTML(s.examples)}</div>`;
    return `<h2 class="ltitle">${esc(it.title)}</h2><div class="lcard one"><div class="cmp">${side(it.left)}<div class="vs">vs.</div>${side(it.right)}</div>${it.tip ? `<div class="tip">💡 ${esc(it.tip)}</div>` : ""}</div>`;
  }
  const b = `${chipsHTML(it.chips)}${it.examples?.length ? `<div class="tlgrid">${exHTML(it.examples)}</div>` : ""}${it.tip ? `<div class="tip">💡 ${esc(it.tip)}</div>` : ""}`;
  return `<h2 class="ltitle">${esc(it.title)}</h2><div class="lcard ${b ? "" : "one"}">
    <div class="lc-a"><div class="llines">${(it.lines||[]).map(l => `<p>${esc(l)}</p>`).join("")}</div>
    ${(it.visual||[]).length ? `<div class="tlgrid">${it.visual.map(tlFig).join("")}</div>` : ""}</div>
    ${b ? `<div class="lc-b">${b}</div>` : ""}</div>`;
}
const isLearn = it => it.type === "learn" || it.type === "compare";

/* ---------- views ---------- */
let view = {name:"home"};
let P = null; // play session
function go(v){ view = v; if (canSpeak) speechSynthesis.cancel(); render(); window.scrollTo(0,0); }

function render(){
  if (!WORLDS.length && view.name !== "error") return;
  if (view.name === "home") return renderHome();
  if (view.name === "level") return renderLevel();
  if (view.name === "play") return renderPlay();
  if (view.name === "result") return renderResult();

function statsBar(){
  const s = liveStreak(), into = S.xp % 100;
  return `<div class="stats">
    <div class="stat"><div class="lab">Level</div><div class="val">${lvlOf(S.xp)}</div><div class="xpbar" aria-label="${into} of 100 XP to next level"><i style="width:${into}%"></i></div></div>

}

    });
    if (ch.boss){ const open = bossOpen(ch), d = S.cleared[bossKey(ch)];
      h += `<button class="stone t-plan ${open ? "" : "locked"}" ${open ? `data-act="boss" data-ch="${ch.id}"` : `aria-disabled="true"`}><span class="disc" style="font-size:30px">${open ? esc(ch.boss.icon||"👾") : "🔒"}${d ? '<span class="star">★</span>' : ""}</span><span class="meta"><b>${esc(ch.boss.title)}</b><span>${open ? ch.boss.items.length + " mistakes to fix · win with 70%" : "Unlocks when every level has ★"}</span></span></button>`; }
    h += `</div>`;

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

/* ---------- play ---------- */
function startPlay(ch, kind, lv, mi){
  const src = kind === "scout" ? ch.scout : kind === "boss" ? ch.boss : kind === "lesson" ? lv.lesson : lv.missions[mi];
  let items = src.items;
  if (kind === "mission") items = [{type:"learn", title:"Quick reminder", lines: lv.rule.lines, visual: lv.rule.timeline, examples: lv.rule.examples}, ...items];
  P = {ch, kind, lv, mi, title: src.title, items, scored: items.filter(x => !isLearn(x)).length, idx: 0, right: 0, combo: 0, xp: 0, state: null, log: []};
  go({name:"play"});
}
function itemRuleLevel(it){ const id = it.rule || P.lv?.id; return id ? findLevel(id) : null; }
function answerText(it){
  switch (it.type){
    case "fill": return it.accept[0];
    case "choice": case "listen": return it.answer.map(i => it.options[i]).join(" + ");
    case "judge": return it.answer === "correct" ? "Correct sentence ✓" : it.fix;
    case "order": return it.events[it.first];
    case "sort": return it.buckets[it.answer];
    case "errorfix": return it.options[it.answer];
  }
  return "";
}
function fullSentence(it){ return _fs(it).replace(/\s*(Ø \(nothing\)|nothing \(Ø\))\s*/g, " ").trim(); }
function _fs(it){
  if ((it.type === "fill" || it.type === "choice") && it.text.includes("___") && (it.type === "fill" || it.answer.length === 1)) return it.text.replace("___", answerText(it));
  if (it.type === "judge") return it.answer === "correct" ? it.text : it.fix;
  if (it.type === "errorfix") return it.options[it.answer];
  if (it.type === "listen") return it.say;
  if (it.type === "sort") return it.word;
  return it.text;
}
function qText(it, filled){
  let h = esc(it.text);
  if (h.includes("___")) h = h.replace("___", filled != null ? `<span class="blank filled">${esc(filled)}</span>` : `<span class="blank">___</span>`);
  return h;
}
const LABEL = {fill:"Type or write the answer", choice:"Choose the answer", judge:"Is this sentence correct?", order:"Which started first?", sort:"Sort it!", listen:"Listen", errorfix:"Tap the mistake(s)"};

function renderPlay(){
  const it = P.items[P.idx], pct = Math.round(P.idx / P.items.length * 100);
  P.state = {done:false, sel:new Set(), step:1};
  if (isLearn(it)){
    const lastLearn = !P.items[P.idx + 1] || !isLearn(P.items[P.idx + 1]);
    const label = P.idx + 1 >= P.items.length ? "Finish" : lastLearn ? "Got it → try it" : "Got it →";
    app.innerHTML = `<div class="play"><div class="wrap wide" style="width:100%"><div class="playbar"><button class="iconbtn" data-act="quit" aria-label="Quit">✕</button><div class="prog"><i style="width:${pct}%"></i></div><span class="combo"></span></div><div class="stage" style="padding-bottom:120px"><div class="qlabel">📖 ${P.kind === "lesson" ? "Learn" : "Before you start"}</div>${learnHTML(it)}</div></div>
      <div class="dock"><div><button class="btn" data-act="next">${label}</button></div></div></div>`;
    return;
  }
  const multi = (it.type === "choice" || it.type === "listen") && it.answer.length > 1;
  let body = "";
  const lab = it.ask || (multi ? "Choose all that fit" : LABEL[it.type]);
  body += `<div class="qlabel">${esc(lab)}</div>`;
  if (it.ctx) body += `<p class="ctx">${esc(it.ctx)}</p>`;
  if (it.type === "listen"){
    body += `<div class="listenbox"><button class="playbig" data-act="hearq" aria-label="Play sentence">▶</button>${canSpeak ? `<button class="playslow" data-act="hearslow" aria-label="Play slowly">🐢</button>` : ""}</div><p class="hidden-text" id="lt">${canSpeak ? "Tap ▶ and listen. The text appears after you answer." : esc(it.say)}</p>`;
  } else if (it.type === "sort"){
    body += `<div class="bigword">${esc(it.word)}</div><div style="text-align:center">${spk(it.word)}</div>`;
  } else if (it.type === "errorfix"){
    body += `<div class="tokens" id="toks">${tokens(it).map((t, i) => `<button class="tok" data-act="tok" data-i="${i}">${esc(t.w)}</button>`).join("")}</div><div id="step2"></div>`;
  } else {
    body += `<div class="qrow"><p class="qtext" id="qt">${qText(it)}</p>${spk(it.text)}</div>`;
    if (it.type === "fill" && it.verb) body += `<span class="verbhint">(${esc(it.verb)})</span>`;
  }
  if (it.type === "fill") body += `<input class="fillin" id="fillin" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Type or write here…" aria-label="Your answer">`;
  if (it.type === "choice" || it.type === "listen"){
    const two = it.options.length === 2 && it.options.every(o => o.length < 16);
    body += `<div class="opts ${two ? "two" : ""}">${it.options.map((o, i) => `<button class="opt" data-act="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  }
  if (it.type === "judge") body += `<div class="opts two"><button class="opt" data-act="judge" data-v="correct">✅ Correct</button><button class="opt" data-act="judge" data-v="wrong">❌ Wrong</button></div>`;
  if (it.type === "order") body += `<div class="opts">${it.events.map((e, i) => `<button class="opt" data-act="order" data-i="${i}">${esc(e)}</button>`).join("")}</div>`;
  if (it.type === "sort") body += `<div class="opts">${it.buckets.map((b, i) => `<button class="opt" data-act="sort" data-i="${i}" style="text-align:center">${esc(b)}</button>`).join("")}</div>`;

  const needCheck = it.type === "fill" || multi || it.type === "errorfix";
  const sl = (P.kind === "mission" || P.kind === "lesson") ? itemRuleLevel(it) : null;
  const side = sl ? `<aside class="side t-${sl.lv.t}"><div class="qlabel">📖 Cheat sheet · ${esc(sl.lv.title)}</div>${ruleCard(sl.lv)}</aside>` : "";
  app.innerHTML = `<div class="play"><div class="wrap wide" style="width:100%"><div class="playbar"><button class="iconbtn" data-act="quit" aria-label="Quit mission">✕</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="combo" id="combo">${P.combo >= 2 ? "🔥" + P.combo : ""}</span></div><div class="stage ${side ? "cols" : ""}">${side}<div class="main">${body}</div></div></div>
    ${needCheck ? `<div class="dock" id="dock"><div><button class="btn" data-act="check" id="checkbtn" ${it.type === "fill" ? "" : "disabled"}>Check</button></div></div>` : ""}</div>`;
  const inp = document.getElementById("fillin");
  if (inp){ inp.addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); check(); } }); if (matchMedia("(pointer:fine)").matches) inp.focus(); }
}
function tokens(it){
  const out = []; let g = -1;
  const re = /\[([^\]]+)\]|(\S+)/g; let m;
  while ((m = re.exec(it.text))){
    if (m[1]){ g++; for (const w of m[1].split(/\s+/)) out.push({w, g}); }
    else out.push({w: m[2], g: -1});
  }
  return out;
}
function canon(s){
  return String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/\s*'\s*/g, "'").trim().replace(/[.!?,]+$/, "").replace(/\s+/g, " ")
    .replace(/\bcan't\b/g, "can not").replace(/\bcannot\b/g, "can not").replace(/\bwon't\b/g, "will not")
    .replace(/n't\b/g, " not").replace(/'m\b/g, " am").replace(/'re\b/g, " are").replace(/'s\b/g, " is").replace(/'ve\b/g, " have")
    .replace(/\s+/g, " ").trim();
}

function onOpt(i){
  const it = P.items[P.idx]; if (P.state.done) return;
  if (it.answer.length > 1){
    P.state.sel.has(i) ? P.state.sel.delete(i) : P.state.sel.add(i);
    document.querySelectorAll(".opt").forEach((b, j) => b.classList.toggle("sel", P.state.sel.has(j)));
    document.getElementById("checkbtn").disabled = P.state.sel.size === 0; return;
  }
  P.state.sel = new Set([i]); check();
}
function check(){
  const it = P.items[P.idx], st = P.state; if (st.done) return;
  let ok = false;
  if (it.type === "fill"){
    const inp = document.getElementById("fillin"); const v = inp.value;
    if (!v.trim()){ inp.classList.add("shake"); setTimeout(() => inp.classList.remove("shake"), 320); return; }
    ok = it.accept.some(a => canon(a) === canon(v));
    inp.classList.add(ok ? "right" : "wrong"); inp.readOnly = true;
    document.getElementById("qt").innerHTML = qText(it, answerText(it));
  } else if (it.type === "choice" || it.type === "listen"){
    const want = new Set(it.answer); ok = want.size === st.sel.size && [...want].every(x => st.sel.has(x));
    document.querySelectorAll(".opt").forEach((b, j) => { b.classList.remove("sel");
      if (want.has(j)) b.classList.add("right"); else if (st.sel.has(j)) b.classList.add("wrong"); else b.classList.add("dim"); });
    if (it.type === "choice" && it.answer.length === 1) { const q = document.getElementById("qt"); if (q) q.innerHTML = qText(it, answerText(it)); }
    if (it.type === "listen"){ const lt = document.getElementById("lt"); lt.textContent = "“" + it.say + "”"; lt.style.color = "var(--ink)"; }
  } else if (it.type === "judge" || it.type === "order" || it.type === "sort"){
    const pick = [...st.sel][0];
    const want = it.type === "judge" ? (it.answer === "correct" ? 0 : 1) : it.type === "order" ? it.first : it.answer;
    ok = pick === want;
    document.querySelectorAll(".opt").forEach((b, j) => b.classList.add(j === want ? "right" : j === pick ? "wrong" : "dim"));
    if (it.type === "order") document.querySelectorAll(".opt").forEach((b, j) => b.insertAdjacentHTML("afterbegin", `<span class="rtag t-pastprog" style="margin-right:8px">${j === it.first ? "1st" : "2nd"}</span>`));
  } else if (it.type === "errorfix"){
    if (st.step === 1){
      const toks = tokens(it), groups = new Set(toks.filter(t => t.g >= 0).map(t => t.g));
      const hit = new Set([...st.sel].map(i => toks[i].g).filter(g => g >= 0));
      const extra = [...st.sel].some(i => toks[i].g < 0);
      const found = !extra && [...groups].every(g => hit.has(g));
      document.querySelectorAll(".tok").forEach((b, i) => { b.disabled = true; b.classList.remove("sel");
        if (toks[i].g >= 0) b.classList.add(st.sel.has(i) ? "err" : "miss"); });
      st.step = 2; st.found = found;
      document.getElementById("step2").innerHTML = `<div class="step2"><div class="qlabel">${found ? "Found it! Now pick the fix" : "Mistakes are in red. Pick the fix"}</div><div class="opts">${it.options.map((o, i) => `<button class="opt" data-act="fixopt" data-i="${i}">${esc(o)}</button>`).join("")}</div></div>`;
      const dock = document.getElementById("dock"); if (dock) dock.remove();
      return;
    }
    const pick = [...st.sel][0]; ok = pick === it.answer;
    document.querySelectorAll("#step2 .opt").forEach((b, j) => b.classList.add(j === it.answer ? "right" : j === pick ? "wrong" : "dim"));
  }
  st.done = true;
  st.given = givenText(it, st); P.log.push({it, ok, given: st.given});
  const dock = document.getElementById("dock"); if (dock) dock.remove();
  let gain = 0;
  if (ok){ P.right++; P.combo++; gain = 10; if (P.combo % 3 === 0) gain += 5; P.xp += gain; }
  else P.combo = 0;
  const cb = document.getElementById("combo"); if (cb){ cb.textContent = P.combo >= 2 ? "🔥" + P.combo : ""; if (P.combo >= 2) { cb.classList.remove("pop"); void cb.offsetWidth; cb.classList.add("pop"); } }
  showSheet(it, ok, gain);
}
function showSheet(it, ok, gain){
  const rl = itemRuleLevel(it);
  const tag = rl ? `<button class="rtag t-${rl.lv.t}" data-act="rule" data-lv="${rl.lv.id}" aria-label="See rule ${esc(rl.lv.tag)}"><i class="dot"></i>${esc(rl.lv.tag === "Mix" || rl.lv.tag === "Bonus" ? rl.lv.title : rl.lv.tag)}</button>` : "";
  const praise = ["Nice!","Great!","Yes!","Perfect!","You got it!"][Math.floor(Math.random()*5)];
  const combo = gain > 10 ? " · combo!" : "";
  const el = document.createElement("div");
  el.className = "sheet " + (ok ? "ok" : "bad"); el.setAttribute("role", "status");
  el.innerHTML = `<div><div class="head"><span>${ok ? praise : "Not quite"}</span>${ok ? `<span class="xp">+${gain} XP${combo}</span>` : ""}</div>

    <div class="row">${canSpeak ? `<button class="iconbtn" data-say="${esc(fullSentence(it))}" aria-label="Hear the correct sentence">🔊</button>` : ""}${rl ? `<button class="iconbtn" data-act="rule" data-lv="${rl.lv.id}" aria-label="See rule">📖</button>` : ""}<button class="btn" data-act="next" id="nextbtn">Continue</button></div></div>`;

function next(){
  P.idx++;
  if (P.idx < P.items.length) return renderPlay();
  finish();
}
function finish(){
  const total = P.scored, pct = total ? Math.round(P.right / total * 100) : 100;
  const key = P.kind === "scout" ? scoutKey(P.ch) : P.kind === "boss" ? bossKey(P.ch) : P.kind === "lesson" ? mk(P.ch, P.lv.id, "learn") : mk(P.ch, P.lv.id, P.mi);
  const first = !S.cleared[key];
  const win = P.kind !== "boss" || pct >= 70;
  let bonus = 0;
  if (P.kind === "boss") bonus = win ? (first ? 200 : 50) : 0;
  else if (P.kind === "lesson") bonus = first ? 30 : 10;
  else bonus = first ? 50 : 20;
  S.best[key] = Math.max(S.best[key] || 0, pct);
  const wasDone = P.lv ? levelDone(P.ch, P.lv) : false;
  if (win) S.cleared[key] = true;
  touchStreak();
  addXP(P.xp + bonus);
  const newBadges = [];
  if (P.lv && !wasDone && levelDone(P.ch, P.lv)){ const b = P.ch.id + "/" + P.lv.id; if (!S.badges.includes(b)){ S.badges.push(b); newBadges.push(badgeName(b)); } }
  if (P.kind === "boss" && win){ const b = P.ch.id + "/world"; if (!S.badges.includes(b)){ S.badges.push(b); newBadges.push("World " + P.ch.num + " conquered"); } }
  save();
  view = {name:"result", pct, gained: P.xp + bonus, bonus, win, newBadges};
  render(); window.scrollTo(0,0);
  if (win && pct >= 50) confetti();
  newBadges.forEach(b => toast("🏅 Badge: " + b));
}
function nextTarget(){
  const ch = P.ch;
  if (P.kind === "mission" || P.kind === "lesson"){
    const lv = P.lv, n = lv.missions.length, from = P.kind === "lesson" ? -1 : P.mi;
    for (let k = 1; k <= n; k++){ const i = ((from + k) % n + n) % n; if (!S.cleared[mk(ch, lv.id, i)]) return {kind:"mission", lv, mi:i, title: lv.missions[i].title}; }
    const li = ch.levels.indexOf(lv);
    for (let j = li + 1; j < ch.levels.length; j++){ const L = ch.levels[j];
      if (!levelOpen(ch, j)) break;
      if (L.lesson && !S.cleared[mk(ch, L.id, "learn")]) return {kind:"lesson", lv:L, title: L.lesson.title};
      const i = L.missions.findIndex((m, x) => !S.cleared[mk(ch, L.id, x)]);
      if (i >= 0) return {kind:"mission", lv:L, mi:i, title: L.missions[i].title}; }
    if (bossOpen(ch) && !S.cleared[bossKey(ch)]) return {kind:"boss", title: ch.boss.title};
    return null;
  }
  if (P.kind === "scout"){ for (const L of ch.levels){ const i = L.missions.findIndex((m, x) => !S.cleared[mk(ch, L.id, x)]); if (i >= 0) return {kind:"mission", lv:L, mi:i, title:L.missions[i].title}; } }
  return null;
}
function renderResult(){

  app.innerHTML = `<div class="wrap wide result"><div class="trophy pop">${icon}</div><h1>${title}</h1><p class="muted" style="margin:0">${esc(P.title)} · ${esc(sub)}</p>

function givenText(it, st){
  const pick = [...st.sel][0];
  switch (it.type){
    case "fill": return document.getElementById("fillin").value.trim();
    case "choice": case "listen": return [...st.sel].sort((a, b) => a - b).map(i => it.options[i]).join(" + ");
    case "judge": return pick === 0 ? "Correct" : "Wrong";
    case "order": return it.events[pick] + " first";
    case "sort": return it.buckets[pick];
    case "errorfix": return it.options[pick];
  }
  return "";
}
function rightHTML(it){
  const a = `<mark class="t-ok">${esc(answerText(it))}</mark>`;
  switch (it.type){
    case "fill": return esc(it.text).replace("___", () => a);
    case "choice": return it.text.includes("___") && it.answer.length === 1 ? esc(it.text).replace("___", () => a) : esc(it.text) + " → " + a;
    case "listen": return esc(it.say) + " → " + a;
    case "judge": return it.answer === "correct" ? esc(it.text) + " ✓" : `<mark class="t-ok">${esc(it.fix)}</mark>`;
    case "errorfix": return esc(it.options[it.answer]);
    case "order": return esc(it.text) + " → first: " + a;
    case "sort": return esc(it.word) + " → " + a;
  }
  return esc(it.text || "");
}
function revRow(e){

}
function summaryHTML(){

}

let C = null, samplePromise = null;

const RULES = t => t.claudePrompt + "\n\nRules for every reply: use simple English (B1 level) and keep it to 1-3 short sentences. Ask only one question at a time. If my last message has a grammar mistake, start your reply with a line \"✏️ Better: <my sentence corrected>\" and then continue. If it has no mistake, don't mention grammar.\n\nStart now: greet me in one short line and give me the first question or task.";

function bubble(role, text){
  const m = document.createElement("div"); m.className = "msg " + (role === "user" ? "me" : "ai"); m.textContent = text;
  const box = document.getElementById("msgs"); box.appendChild(m); box.scrollTop = box.scrollHeight; return m;
}
async function ask(){
  const sample = await getSample(); if (!C || !sample) return;
  C.busy = true; setSend();
  const el = bubble("assistant", "Thinking…");
  const ctl = C.ctl = new AbortController();
  // The rules turn always leads; history follows and always ends on the learner's turn.
  const input = [{role:"user", content: RULES(C.t)}, ...C.turns.slice(-16)];
  try {
    const {text} = await sample(input, {modelTier:"quick", cache:false, signal: ctl.signal, onText: ({text}) => { el.textContent = text; const b = document.getElementById("msgs"); if (b) b.scrollTop = b.scrollHeight; }});
    if (!C) return;
    C.turns.push({role:"assistant", content:text}); el.textContent = text;
    if (canSpeak){ const s = document.createElement("div"); s.className = "say"; s.innerHTML = `<button class="linkbtn" data-say="${esc(text.replace(/^✏️.*\n?/, ""))}">🔊 Listen</button>`; el.appendChild(s); }
  } catch (e) {
    if (!C) return;
    const code = e?.code;
    if (code === "cancelled"){ el.textContent = e.text || "(stopped)"; }
    else if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){ el.remove(); C.busy = false; return chatFallback(); }
    else if (code === "rate_limited"){ el.textContent = (e.text ? e.text + "\n\n" : "") + "Claude is busy right now. Wait a minute, then send your message again."; }
    else { el.textContent = (e?.text ? e.text + "\n\n" : "") + "That reply didn't arrive. Send your message again to retry."; }
  }
  if (C){ C.busy = false; setSend(); }
}
function setSend(){ const b = document.getElementById("sendbtn"); if (b) b.disabled = !!C?.busy; }
function sendChat(){
  if (!C || C.busy) return;
  const ta = document.getElementById("chatin"); const v = ta.value.trim(); if (!v) return;
  ta.value = ""; bubble("user", v);
  const last = C.turns[C.turns.length - 1];
  if (last?.role === "user") last.content += "\n" + v; else C.turns.push({role:"user", content:v});
  C.mine++;
  if (C.mine === 3 && !S.talks[C.key]){ S.talks[C.key] = 1; touchStreak(); addXP(20); save(); toast("💬 +20 XP for practicing with Claude"); }
  ask();
}
function chatFallback(){
  const box = document.getElementById("msgs"); const cw = document.getElementById("composerwrap"); if (cw) cw.remove();
  if (!box || !C) return;
  const prompt = RULES(C.t);
  box.innerHTML = `<div class="task" style="border-style:solid">This needs internet. Tap <b>Copy prompt</b>, open the Claude app, and paste it into a new chat.</div><textarea class="promptbox" id="pbox" readonly>${esc(prompt)}</textarea><button class="btn" data-act="copyprompt">Copy prompt</button><a class="btn ghost" style="text-decoration:none;margin-top:4px" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude ↗</a>`;
}

async function exportBackup(){

  } catch { toast("Use “Copy backup as text” instead."); }
}

    case "send": sendChat(); break;
    case "copyprompt": { const ta = document.getElementById("pbox");
      try { navigator.clipboard.writeText(ta.value).then(() => { toast("Copied! Paste it into a new Claude chat."); if (C && !S.talks[C.key]){ S.talks[C.key] = 1; touchStreak(); addXP(20); save(); toast("💬 +20 XP for practicing with Claude"); } }, () => { ta.select(); toast("Select all and copy the text."); }); }
      catch { ta.select(); toast("Select all and copy the text."); } break; }
  }
});

/* ---------- boot ---------- */
(async () => {
  try { await loadWorlds(); }
  catch (err) { view = {name:"error"}; app.innerHTML = `<div class="wrap"><div class="err"><b>The chapters didn't load.</b><p class="muted">Close the app and open it again. The first time, you need internet.</p></div></div>`; return; }
  if (!WORLDS.length){ app.innerHTML = `<div class="wrap"><div class="err"><b>No chapters yet.</b></div></div>`; return; }
  render();
  let seen = false; try { seen = !!localStorage.getItem("grammar-quest-help"); } catch {}
  if (!seen && !S.xp) openHelp();
  connectDb();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch {}
  try {
    if ("serviceWorker" in navigator && !window.claude && /^https?:$/.test(location.protocol)){
      const had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register("sw.js").catch(() => {});
      navigator.serviceWorker.addEventListener("controllerchange", () => { toast(had ? "✨ Updated! Close and reopen to see new chapters." : "📴 Ready to use offline"); });
    }
  } catch {}
})();
})();
</script>
